# Pull request previews (decision D-025; see CONTRIBUTING.md, "Previews and publication").
#
# Every pull request gets a rendered copy of the whole site at
#   https://genomicdatainfrastructure.github.io/system-architecture/pr-<number>/
# so that reviewers can read a draft page in context (navigation, glossary links, chapter 11 links).
# The site is built with PR_NUMBER set (docusaurus.config.ts derives the baseUrl from it), pushed
# to the gh-pages branch under pr-<number>/, and the URL is posted in one comment on the pull
# request, which is updated on every push. When the pull request is closed, the folder is removed.
# The production deploy (deploy.yml) publishes to the root of the same branch and leaves pr-* alone.
#
# Only branches of this repository are previewed: a pull request from a fork runs with a read-only
# token and cannot push to gh-pages.

name: Pull request preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write # push to the gh-pages branch
  pull-requests: write # the preview comment

# One run per pull request at a time; a newer push cancels the build of the older one.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PREVIEW_URL: https://genomicdatainfrastructure.github.io/system-architecture/pr-${{ github.event.pull_request.number }}/

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so pages can show their last author and date
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site under /system-architecture/pr-${{ env.PR_NUMBER }}/
        run: npm run build # reads PR_NUMBER
      - name: Publish to gh-pages under pr-${{ env.PR_NUMBER }}/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          target-folder: pr-${{ env.PR_NUMBER }}
          clean: true # removes files of this preview that the new build no longer has; other folders are untouched
          force: false # several previews may publish at once: rebase and retry instead of force-pushing
          attempt-limit: 5
          commit-message: 'Preview of pull request #${{ env.PR_NUMBER }} (${{ github.event.pull_request.head.sha }})'
      - name: Post or update the preview comment
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const {PR_NUMBER, PREVIEW_URL, HEAD_SHA} = process.env;
            const body = [
              '<!-- pr-preview -->',
              `**Preview of this pull request:** ${PREVIEW_URL}`,
              '',
              `Built from ${HEAD_SHA.slice(0, 7)} on ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC. `
                + 'GitHub Pages takes a minute or two to publish it. '
                + 'The preview is updated on every push and removed when the pull request is closed.',
            ].join('\n');
            await upsert(body);

            async function upsert(body) {
              const {owner, repo} = context.repo;
              const issue_number = Number(PR_NUMBER);
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
              const existing = comments.find((c) => c.body?.startsWith('<!-- pr-preview -->'));
              if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
              else await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

  remove:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p empty
      - name: Remove pr-${{ env.PR_NUMBER }}/ from gh-pages
        # Deploying an empty folder with clean removes every file of the preview; Git then drops the folder.
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: empty
          branch: gh-pages
          target-folder: pr-${{ env.PR_NUMBER }}
          clean: true
          force: false
          attempt-limit: 5
          commit-message: 'Remove the preview of pull request #${{ env.PR_NUMBER }}'
      - name: Update the preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const existing = comments.find((c) => c.body?.startsWith('<!-- pr-preview -->'));
            if (!existing) return;
            const body = '<!-- pr-preview -->\n**Preview removed:** the pull request is closed. Reopen it to build the preview again.';
            await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
