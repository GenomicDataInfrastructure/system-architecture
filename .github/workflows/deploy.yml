# Publishes main to the root of the gh-pages branch, which GitHub Pages serves (decision D-025).
# Pull request previews live in pr-<number>/ folders of the same branch (preview.yml); this deploy
# leaves them alone. The repository's Pages source must be "Deploy from a branch: gh-pages, / (root)"
# (Settings > Pages); see CONTRIBUTING.md, "Previews and publication".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so pages can show their last author and date
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to the root of gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true # removes files the new build no longer has (renamed or deleted pages) …
          clean-exclude: |
            pr-*
          # … except the pull request previews
          force: false # a preview may publish at the same time: rebase and retry instead of force-pushing
          attempt-limit: 5
          commit-message: 'Deploy ${{ github.sha }}'
